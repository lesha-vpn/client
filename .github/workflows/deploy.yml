name: 'Build'

# Builds installable Лёша VPN (LeshaVPN) packages for Linux, Windows, macOS and
# Android, and publishes them to a GitHub Release:
#   - on every push to dev (a merged PR) whose version has no release yet: the job creates the tag
#     v<AMNEZIAVPN_VERSION>-lesha.<LESHA_VERSION> (root CMakeLists.txt) itself. A push that does not
#     bump LESHA_VERSION finds the tag already there and publishes nothing.
#   - when a `v*` tag is pushed by hand. The tag must be v<AMNEZIAVPN_VERSION>-lesha.<LESHA_VERSION>,
#     optionally with -rcN/-betaN (prerelease).
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   COORDINATOR_API_URL  default coordinator API URL baked into the client (may be empty)
#   ENABLE_IOS           'true' to build iOS (needs the IOS_* secrets below)
#   APPLE_SIGNING        'true' to sign/notarize macOS (and iOS) builds
#
# Secrets (all optional; without them CI still goes green):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     release keystore for the APK; when absent a throwaway key is generated per run
#   MAC_* / APPLE_DEV_* / IOS_* / APPSTORE_CONNECT_*: Apple signing, see the macOS and iOS jobs
#
# Third-party dependencies come from conan: prebuilt packages are downloaded anonymously
# from Amnezia's public remote (added by cmake/recipes_bootstrap.cmake), anything missing
# there is built locally (--build=missing). Nothing is ever uploaded.

on:
  push:
    branches:
      - dev
      - 'claude/**'
    tags:
      - 'v*'
  # No pull_request trigger: a PR from a pushed branch already gets the push run's checks, and
  # both triggers would build every commit twice.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # queue a newer run instead of cancelling: a 30-minute Windows/Android build is worth finishing
  cancel-in-progress: false

permissions:
  contents: read

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/ # https://download.qt.io/static/mirrorlist/
  COORDINATOR_API_URL: ${{ vars.COORDINATOR_API_URL }}

jobs:

  Build-Linux-Ubuntu:
    runs-on: ubuntu-22.04

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7

    steps:
    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Install system packages'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    # Compiler cache: a rebuild after a small change recompiles only what changed.
    # CMake picks the launcher up from CMAKE_<LANG>_COMPILER_LAUNCHER in the environment.
    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}-linux
        max-size: 1G

    - name: 'Build project'
      shell: bash
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: ON
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload Linux test build'
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: deploy/build/client/tests
        retention-days: 7

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: deploy/build/LeshaVPN_linux-x64_*.run
        if-no-files-found: error
        retention-days: 14

# ------------------------------------------------------

  Build-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ninja'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup mvsc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        wix extension list -g
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    # Compiler cache. MSVC works with ccache only under Ninja (not the Visual Studio
    # generator), so the build below switches the generator through CMAKE_GENERATOR.
    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}
        max-size: 2G

    # Unsigned: code signing would need a certificate (build.bat --sign-cloud/--sign-phys).
    # MSI only: upstream also builds a Qt Installer Framework .exe, a second unrelated installer.
    - name: 'Build project'
      shell: cmd
      env:
        CMAKE_GENERATOR: Ninja
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer wix

    - name: 'Show WiX log'
      if: failure()
      shell: pwsh
      run: Get-ChildItem deploy/build/_CPack_Packages -Recurse -Filter wix.log | ForEach-Object { Get-Content $_.FullName }

    - name: 'Upload installer artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: |
          deploy/build/LeshaVPN_windows-x64_*.msi
        if-no-files-found: error
        retention-days: 14

# ------------------------------------------------------

  Build-MacOS:
    runs-on: macos-15

    env:
      QT_VERSION: 6.10.1
      KEYCHAIN_PASSWORD: ""

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    # Signing/notarization only runs with the repository variable APPLE_SIGNING == 'true'
    # and the MAC_* / APPLE_DEV_* secrets set; otherwise the .pkg is unsigned.
    - uses: ./.github/actions/apple-setup-keychain
      if: vars.APPLE_SIGNING == 'true'
      id: setup-keychain
      with:
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}

    - uses: ./.github/actions/apple-install-cert
      if: vars.APPLE_SIGNING == 'true'
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.MAC_APP_CERT_CERT }}
        cert-password: ${{ secrets.MAC_APP_CERT_PW }}

    - uses: ./.github/actions/apple-install-cert
      if: vars.APPLE_SIGNING == 'true'
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.MAC_INSTALLER_SIGNER_CERT }}
        cert-password: ${{ secrets.MAC_INSTALL_CERT_PW }}

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3.0'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    # Compiler cache: a rebuild after a small change recompiles only what changed.
    # CMake picks the launcher up from CMAKE_<LANG>_COMPILER_LAUNCHER in the environment.
    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}-macos
        max-size: 1G

    - name: 'Build project'
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        QT_INSTALL_DIR: ${{ runner.temp }}
        CODESIGN_SIGNATURE: ${{ vars.APPLE_SIGNING == 'true' && secrets.MAC_SIGNER_ID || '' }}
        CODESIGN_INSTALLER_SIGNATURE: ${{ vars.APPLE_SIGNING == 'true' && secrets.MAC_INSTALLER_SIGNER_ID || '' }}
        CODESIGN_KEYCHAIN: ${{ steps.setup-keychain.outputs.keychain-path }}
        CODESIGN_INSTALLER_KEYCHAIN: ${{ steps.setup-keychain.outputs.keychain-path }}
        NOTARYTOOL_TEAM_ID: ${{ vars.APPLE_SIGNING == 'true' && secrets.MAC_TEAM_ID || '' }}
        NOTARYTOOL_EMAIL: ${{ vars.APPLE_SIGNING == 'true' && secrets.APPLE_DEV_EMAIL || '' }}
        NOTARYTOOL_PASSWORD: ${{ vars.APPLE_SIGNING == 'true' && secrets.APPLE_DEV_PASSWORD || '' }}
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v4
      with:
        name: release-macos
        path: deploy/build/LeshaVPN_macos_*.pkg
        if-no-files-found: error
        retention-days: 14

# ------------------------------------------------------

  Build-iOS:
    # Disabled until there is an Apple developer account: set the repository variable
    # ENABLE_IOS=true and the IOS_* secrets (signing cert + app/NE provisioning profiles).
    if: vars.ENABLE_IOS == 'true'
    runs-on: macos-latest

    env:
      QT_VERSION: 6.10.1
      KEYCHAIN_PASSWORD: ""

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - uses: ./.github/actions/apple-setup-keychain
      id: setup-keychain
      with:
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}

    - name: 'Install signing certificate'
      uses: ./.github/actions/apple-install-cert
      with:
        keychain-path: ${{ steps.setup-keychain.outputs.keychain-path }}
        keychain-password: ${{ env.KEYCHAIN_PASSWORD }}
        cert-base64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
        cert-password: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}

    - name: 'Install app provisioning profile'
      uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.IOS_APP_PROVISIONING_PROFILE }}

    - name: 'Install NE provisioning profile'
      uses: ./.github/actions/apple-setup-provisioning-profile
      with:
        provisioning_profile_base64: ${{ secrets.IOS_NE_PROVISIONING_PROFILE }}

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        arch: 'clang_64'
        dir: ${{ runner.temp }}
        set-env: 'true'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install iOS Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'ios'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        extra: '--external 7z --base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install deps'
      run: pip install "conan==2.28.0" jsonschema jinja2

    # Builds and signs the app. Exporting an .ipa / uploading to TestFlight is not wired up yet.
    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
        APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
      run: bash deploy/build.sh -t ios

# ------------------------------------------------------

  Build-Android:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'android9-10'
            qt_version: '6.10.1'
            min_sdk: 28
            max_sdk: 29
            version_code_offset: 0
          - label: 'android11+'
            qt_version: '6.10.3'
            min_sdk: 30
            max_sdk: ''
            version_code_offset: 1

    env:
      ANDROID_PLATFORM: android-${{ matrix.min_sdk }}
      NDK_VERSION: 27.0.11718014
      QT_VERSION: ${{ matrix.qt_version }}
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
      APP_ANDROID_MIN_SDK: ${{ matrix.min_sdk }}
      APP_ANDROID_MAX_SDK: ${{ matrix.max_sdk }}
      APP_ANDROID_VERSION_CODE_OFFSET: ${{ matrix.version_code_offset }}
      # Read by androiddeployqt and by client/android/build.gradle.kts. Without the
      # ANDROID_* secrets a throwaway keystore with these fallback values is generated.
      QT_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
      QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ci-throwaway' }}
      QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ci-throwaway' }}
      QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'ci-throwaway' }}

    steps:
    - name: 'Free disk space'
      run: |
        # gradle packages several APK variants, which can overflow the default runner disk
        df -h /
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
          /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache /opt/microsoft /opt/google \
          /opt/az /usr/share/miniconda /usr/local/julia* /usr/local/share/chromium /usr/lib/firefox \
          /usr/local/lib/node_modules /usr/share/az_* /usr/local/aws-cli /usr/local/share/vcpkg
        sudo docker system prune -af > /dev/null || true
        df -h /

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_armv7 Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_armv7'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        cache: 'true'
        version: ${{ env.QT_VERSION }}
        host: 'all_os'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Prepare keystore'
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      shell: bash
      run: |
        if [[ -n "$KEYSTORE_BASE64" ]]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > "$QT_ANDROID_KEYSTORE_PATH"
          echo "APK_SUFFIX=" >> "$GITHUB_ENV"
        else
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway key generated for this run. Such APKs cannot be updated in place by a later build."
          keytool -genkeypair -noprompt -keystore "$QT_ANDROID_KEYSTORE_PATH" -storetype PKCS12 \
            -alias "$QT_ANDROID_KEYSTORE_ALIAS" -storepass "$QT_ANDROID_KEYSTORE_STORE_PASS" \
            -keypass "$QT_ANDROID_KEYSTORE_STORE_PASS" -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=CI throwaway key"
          echo "APK_SUFFIX=-unofficial-key" >> "$GITHUB_ENV"
        fi

    # Compiler cache: a rebuild after a small change recompiles only what changed.
    # CMake picks the launcher up from CMAKE_<LANG>_COMPILER_LAUNCHER in the environment.
    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ github.job }}-${{ matrix.label }}
        max-size: 2G

    # Conan packages: the Amnezia remote has no prebuilt arm64 OpenSSL, so without this
    # it is compiled from source on every run.
    - name: 'Cache conan packages'
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ github.job }}-${{ matrix.label }}-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-${{ github.job }}-${{ matrix.label }}-

    # Gradle distribution and dependencies, downloaded by androiddeployqt's gradle run.
    - name: 'Setup Gradle cache'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        add-job-summary: never

    - name: 'Build project'
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
        QT_INSTALL_DIR: ${{ runner.temp }}
        LABEL: ${{ matrix.label }}
        # package only the ossRelease variant (see client/android/build.gradle.kts)
        ORG_GRADLE_PROJECT_onlyOssRelease: 'true'
      shell: bash
      run: |
        OUT=deploy/artifacts
        rm -rf $OUT && mkdir -p $OUT

        # arm only: x86/x86_64 Android devices are emulators; Intel phones never got Android 9+,
        # and x86 Chromebooks run arm apps through translation. No AAB: we don't publish to Play.
        deploy/build.sh -t android --sign --abi arm64-v8a --abi armeabi-v7a

        # LESHA_FULL_VERSION, e.g. 5.0.3.1-lesha.1 (see the root CMakeLists.txt)
        VERSION=$(grep '^LESHA_FULL_VERSION:INTERNAL=' deploy/build/CMakeCache.txt | cut -d= -f2)
        test -n "$VERSION"

        APK=$(find deploy/build/client/android-build -maxdepth 1 -name '*.apk' | head -n1)
        test -n "$APK"
        # the APK must carry native libs for every ABI built above (an armv7 TV got an arm64-only APK)
        for abi in arm64-v8a armeabi-v7a; do
          unzip -l "$APK" "lib/$abi/libLeshaVPN_$abi.so" >/dev/null || { echo "::error::no lib/$abi in $APK"; unzip -l "$APK" 'lib/*'; exit 1; }
        done
        # LeshaVPN_<platform>_<version>.apk, hyphens inside <platform>
        mv "$APK" "$OUT/LeshaVPN_${LABEL}-universal${APK_SUFFIX}_${VERSION}.apk"

        ls -l $OUT

    - name: 'Upload Android artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: release-android-${{ matrix.min_sdk }}
        path: deploy/artifacts/*.apk
        if-no-files-found: error
        retention-days: 14

# ------------------------------------------------------

  # Unit tests that need no external infrastructure. Tests that need third-party VPN keys
  # or a backup file QSKIP themselves when the corresponding secrets are absent.
  test-linux:
    name: Test Linux
    needs: Build-Linux-Ubuntu
    runs-on: ubuntu-22.04

    env:
      QT_VERSION: 6.10.1
      QTEST_FUNCTION_TIMEOUT: 7200000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 10

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: 'true'
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools
          dir: ${{ runner.temp }}
          set-env: true
          aqtversion: '==3.3.0'
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-0 \
            libsecret-1-dev

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: deploy/build/client/tests

      - name: Restore executable permissions
        run: |
          find deploy/build/client/tests \
            -type f \
            -name "test_*" \
            -exec chmod +x {} \;

      - name: Run tests
        shell: bash
        run: |
          QT_ROOT="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64"

          export LD_LIBRARY_PATH="$PWD/deploy/build/client/tests:$QT_ROOT/lib:${LD_LIBRARY_PATH:-}"
          export QT_QPA_PLATFORM=offscreen

          ctest --test-dir deploy/build/client/tests --output-on-failure

# ------------------------------------------------------

  Release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev'
    needs:
      - Build-Linux-Ubuntu
      - Build-Windows
      - Build-MacOS
      - Build-Android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      # The tag must be v${LESHA_FULL_VERSION} (AMNEZIAVPN_VERSION-lesha.LESHA_VERSION from the
      # root CMakeLists.txt), optionally followed by -rcN / -betaN for a prerelease. On dev the tag
      # is derived from the version, and the release is skipped when that tag already exists.
      - name: Check tag against version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(sed -nE 's/^[[:space:]]*set\(AMNEZIAVPN_VERSION[[:space:]]+([0-9.]+)[[:space:]].*/\1/p' CMakeLists.txt | head -n1)
          LESHA=$(sed -nE 's/^[[:space:]]*set\(LESHA_VERSION[[:space:]]+([0-9]+)[[:space:]].*/\1/p' CMakeLists.txt | head -n1)
          if [ -z "$BASE" ] || [ -z "$LESHA" ]; then
            echo "::error::Could not read AMNEZIAVPN_VERSION / LESHA_VERSION from CMakeLists.txt"
            exit 1
          fi
          FULL="${BASE}-lesha.${LESHA}"
          if [ "$REF_TYPE" = "branch" ]; then
            TAG="v${FULL}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
              echo "Tag ${TAG} already exists: LESHA_VERSION was not bumped, nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$TAG" in
            "v${FULL}")
              PRERELEASE=false ;;
            "v${FULL}"-rc*|"v${FULL}"-beta*)
              PRERELEASE=true ;;
            *)
              echo "::error::Tag '$TAG' does not match the version in CMakeLists.txt: expected 'v${FULL}' (or 'v${FULL}-rcN' / 'v${FULL}-betaN'). Bump LESHA_VERSION in CMakeLists.txt or fix the tag."
              exit 1 ;;
          esac
          echo "Releasing ${FULL} from tag ${TAG} (prerelease: ${PRERELEASE})"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        if: steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List files
        if: steps.version.outputs.skip != 'true'
        run: ls -l dist

      # On dev the action creates the tag at this commit. A tag made with GITHUB_TOKEN does not
      # start another workflow run, so the release is not built twice.
      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
